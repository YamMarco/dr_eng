# LiteLLM proxy config. The app asks for a ROLE (model_name), never a vendor:
# swapping or adding a provider is an edit here, no app deploy.
# Keys come from the proxy's environment (see .env.example), never from the repo.

model_list:
  # Short answers and lesson writing: cheap and fast.
  - model_name: grade-short
    litellm_params:
      model: openai/gpt-5.4-nano
      api_key: os.environ/OPENAI_API_KEY
  - model_name: grade-short-fallback
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY

  # 30-point essay: needs judgment on a rubric.
  - model_name: grade-essay
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GEMINI_API_KEY
  - model_name: grade-essay-fallback
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY

  # Handwriting photo -> text (vision). Must transcribe, never correct.
  - model_name: ocr
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GEMINI_API_KEY
  - model_name: ocr-fallback
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY

router_settings:
  num_retries: 1
  timeout: 45
  fallbacks:
    - grade-short: [grade-short-fallback]
    - grade-essay: [grade-essay-fallback]
    - ocr: [ocr-fallback]

litellm_settings:
  drop_params: true # a param one vendor lacks is dropped, not a 400
  # Student text is never logged or cached here.
  turn_off_message_logging: true
  cache: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
